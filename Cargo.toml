[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/fjord-domain",
    "crates/fjord-ports",
    "crates/fjord-services",
    "crates/fjord-git",
    "crates/fjord-db",
    "crates/fjord-fs",
    "crates/fjord-app",
    "crates/fjord-askpass",
    "crates/fjord-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/TheZan/Fjord"

[workspace.dependencies]
fjord-domain = { path = "crates/fjord-domain" }
fjord-ports = { path = "crates/fjord-ports" }
fjord-services = { path = "crates/fjord-services" }
fjord-git = { path = "crates/fjord-git" }
fjord-db = { path = "crates/fjord-db" }
fjord-fs = { path = "crates/fjord-fs" }
fjord-app = { path = "crates/fjord-app" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "io-util", "time", "net"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
