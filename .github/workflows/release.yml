name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  TAURI_UPDATE_ENDPOINT: https://github.com/TheZan/Fjord/releases/latest/download/latest.json

jobs:
  # Parses VERSION from the pushed tag, verifies the same VERSION is what
  # every project file records (scripts/release-lib.mjs — the exact function
  # `npm run release:verify` runs locally), verifies the matching release
  # notes are populated, and requires a green same-SHA `CI` run. Nothing
  # platform-specific happens until this is green.
  prerequisites:
    name: Version, metadata, and green CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Parse the release version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release metadata matches the tag
        run: node scripts/release-verify.mjs --tag "$GITHUB_REF_NAME"

      - name: Verify release notes are populated
        run: node scripts/check-release-notes.mjs "${{ steps.version.outputs.version }}"

      # Fail-closed candidate-SHA safety: a draft release for this tag from
      # an earlier, different commit must never silently receive this
      # commit's assets mixed in with whatever the old attempt already
      # uploaded. GitHub's `target_commitish` on an existing release isn't a
      # reliable candidate fingerprint (it's the ref the tag was created
      # against, not necessarily this exact SHA), so the actual candidate
      # SHA is embedded as an HTML comment in the release body by the
      # "Read release notes for this version" step in `publish` and checked
      # here before any platform build starts. A published release for this
      # tag is never touched. A verified same-SHA retry gets its stale
      # assets cleared so a partial previous attempt can't leave a mix of
      # old and new updater artifacts.
      #
      # This resolves the release by *listing* releases and filtering by
      # `tag_name` (scripts/release-discovery-lib.mjs), not by GitHub's
      # "get a release by tag name" endpoint — that endpoint is documented
      # to return only *published* releases, so it 404s on exactly the
      # still-draft release this workflow itself creates and needs to find.
      - name: Check for an existing release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release-candidate.mjs "${GITHUB_REPOSITORY%/*}" "${GITHUB_REPOSITORY#*/}" "$GITHUB_REF_NAME" "$GITHUB_SHA"

      # A one-shot check races the tag push: `ci.yml` triggers on push to
      # master/develop, but nothing guarantees that run has even started,
      # let alone finished, by the time this job asks. This polls instead of
      # asking once, but still fails closed — an in-progress run only buys
      # more waiting, never a pass; a completed non-success run fails
      # immediately; a bounded wall-clock budget means "CI never showed up"
      # still fails rather than hanging until the runner's own timeout.
      - name: Require successful CI for this commit
        uses: actions/github-script@v8
        timeout-minutes: 25
        with:
          script: |
            const POLL_INTERVAL_MS = 20_000;
            const MAX_WAIT_MS = 20 * 60 * 1000;
            const FAILED_CONCLUSIONS = new Set(["failure", "cancelled", "timed_out"]);
            const sha = context.sha;
            const deadline = Date.now() + MAX_WAIT_MS;

            const describe = (run) => `run #${run.run_number} (${run.status}${run.conclusion ? "/" + run.conclusion : ""})`;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for (;;) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                head_sha: sha,
                per_page: 50,
              });
              const runs = data.workflow_runs;

              const successful = runs.find((run) => run.status === "completed" && run.conclusion === "success");
              if (successful) {
                await core.summary
                  .addHeading("Same-SHA CI prerequisite")
                  .addLink(`CI run #${successful.run_number}`, successful.html_url)
                  .write();
                return;
              }

              const pending = runs.find((run) => run.status === "queued" || run.status === "in_progress");
              if (pending) {
                if (Date.now() >= deadline) {
                  core.setFailed(`Timed out after ${MAX_WAIT_MS / 60_000} minutes waiting for ${describe(pending)} on ${sha} to complete: ${pending.html_url}`);
                  return;
                }
                core.info(`Waiting for ${describe(pending)} on ${sha}...`);
                await sleep(POLL_INTERVAL_MS);
                continue;
              }

              const failed = runs.find((run) => run.status === "completed" && FAILED_CONCLUSIONS.has(run.conclusion));
              if (failed) {
                core.setFailed(`${describe(failed)} for ${sha} did not succeed: ${failed.html_url}`);
                return;
              }

              if (Date.now() >= deadline) {
                core.setFailed(`No CI run for ${sha} appeared within ${MAX_WAIT_MS / 60_000} minutes.`);
                return;
              }
              core.info(`No CI run found yet for ${sha}; waiting...`);
              await sleep(POLL_INTERVAL_MS);
            }

  # Builds, signs, and uploads every platform package to a still-draft,
  # still-prerelease GitHub Release. Nothing here is publicly visible or
  # updater-discoverable yet — that only happens in `publish-release`, once
  # every matrix leg and `packaging-verification` have succeeded.
  publish:
    needs: prerequisites
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prerequisites.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu --bundles appimage --features updater --config src-tauri/tauri.sidecar.conf.json"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --bundles nsis --features updater --config src-tauri/tauri.sidecar.conf.json"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles app,dmg --features updater --config src-tauri/tauri.sidecar.conf.json"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg --features updater --config src-tauri/tauri.sidecar.conf.json"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build askpass sidecar
        run: cargo build --release -p fjord-askpass --target ${{ matrix.target }}

      - name: Prepare askpass sidecar for Tauri
        env:
          FJORD_SIDECAR_TARGET: ${{ matrix.target }}
          FJORD_SIDECAR_PROFILE: release
        run: node scripts/prepare-askpass-sidecar.mjs

      # Platform code-signing (this step, and Apple's APPLE_CERTIFICATE below)
      # is optional — many OSS projects ship unsigned. Absence here only
      # means Windows SmartScreen/macOS Gatekeeper show an unknown-publisher
      # warning on first run; it has no effect on the *updater*'s own
      # cryptographic signature, which stays mandatory (see "Prepare release
      # Tauri config" below and docs/release.md).
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Host "::notice::WINDOWS_CERTIFICATE/WINDOWS_CERTIFICATE_PASSWORD are not set — building an unsigned Windows installer."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "fjord-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare release Tauri config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: node scripts/prepare-tauri-release-config.mjs

      - name: Read release notes for this version
        id: notes
        shell: bash
        run: |
          NOTES_PATH=$(node scripts/print-release-notes-path.mjs "$VERSION")
          {
            echo "body<<FJORD_RELEASE_NOTES_EOF"
            cat "$NOTES_PATH"
            echo ""
            # Machine-checkable candidate marker, invisible in the rendered
            # release page — this is what "Check for an existing release for
            # this tag" in `prerequisites` compares against on a retry, so a
            # tag that moved to a new commit can never be mistaken for the
            # same candidate as an old draft (see that step's comment).
            echo "<!-- fjord-candidate-sha: $GITHUB_SHA -->"
            echo "FJORD_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Apple platform signing is optional (v0.1 policy: unsigned macOS
      # packages are acceptable; updater signing below is not). The decision
      # only ever runs on macOS legs; its "signed"/"unsigned" output selects
      # between the two tauri-action steps further down, which is the only
      # way to make APPLE_* genuinely *absent* from the process env rather
      # than present-but-empty — GitHub Actions expressions can't
      # conditionally omit a key from a step's `env:` map, only ever give it
      # some string value, so two full step declarations are the actual fix
      # (see scripts/apple-signing-lib.mjs and docs/release.md).
      - name: Determine Apple signing mode
        if: runner.os == 'macOS'
        id: apple-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/apple-signing-mode.mjs

      - name: Build and create/update release (Windows/Linux)
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Fjord v${{ env.VERSION }} — Early Preview"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      # No APPLE_* key at all in this step's env — that absence is the fix.
      - name: Build and create/update release (macOS, unsigned)
        if: runner.os == 'macOS' && steps.apple-signing.outputs.mode == 'unsigned'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Fjord v${{ env.VERSION }} — Early Preview"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Build and create/update release (macOS, signed)
        if: runner.os == 'macOS' && steps.apple-signing.outputs.mode == 'signed'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Fjord v${{ env.VERSION }} — Early Preview"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Verify Linux AppImage contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage=$(find target/${{ matrix.target }}/release/bundle/appimage -name "Fjord*${VERSION}*.AppImage" -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/fjord-askpass
          ! find squashfs-root -iname '*fixture*' -o -iname '*.env' | grep -q .

      - name: Verify macOS package contents
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name 'Fjord.app' -print -quit)
          dmg=$(find target/${{ matrix.target }}/release/bundle/dmg -name "Fjord*${VERSION}*.dmg" -print -quit)
          test -d "$app"
          test -n "$dmg"
          test -x "$app/Contents/MacOS/fjord-askpass"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          ! find "$app" -iname '*fixture*' -o -iname '*.env' | grep -q .

      - name: Verify Windows installer contents
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis" -Filter "Fjord*$env:VERSION*.exe" | Select-Object -First 1
          if (-not $installer) { throw "versioned Fjord NSIS installer was not produced" }
          $listing = 7z l $installer.FullName
          if ($LASTEXITCODE -ne 0) { $listing; throw "could not inspect NSIS installer" }
          if (-not ($listing | Select-String -SimpleMatch 'fjord-askpass.exe' -Quiet)) { throw "fjord-askpass.exe is missing" }
          if ($listing | Select-String -Pattern 'fixture|test-data|\.env' -Quiet) { throw "development-only content is present" }

  # Generic, version-parameterized asset-completeness check — every platform
  # package, the updater manifest, and its signatures must be attached to the
  # still-draft release before anything is allowed to go live. This replaced
  # a v0.1-only gate that additionally required V0_1_CLEAN_MACHINE_EVIDENCE /
  # V0_1_FRESH_INSTALL_EVIDENCE repo variables; that evidence requirement was
  # correct for the one-time first public launch but would otherwise block
  # every future patch release on variables that only ever applied to
  # v0.1.0. See docs/releasing.md and docs/release.md for where that
  # first-launch checklist lives now (`npm run gate:v0.1`, run by hand before
  # pushing the v0.1.0 tag specifically).
  packaging-verification:
    name: Packaging verification
    if: ${{ always() }}
    needs: [prerequisites, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.resolve.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prerequisites.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Same reasoning as "Check for an existing release for this tag" in
      # `prerequisites`: `gh api repos/.../releases/tags/vX.Y.Z` 404s on a
      # draft, which this release still is at this point by design (nothing
      # publishes before this job passes). Resolve by listing instead.
      - name: Resolve the draft release for this tag
        id: resolve
        if: needs.publish.result == 'success'
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          node scripts/resolve-release-by-tag.mjs "$OWNER" "$REPO" "v$VERSION" > /tmp/release.json
          if [[ "$(cat /tmp/release.json)" != "null" ]]; then
            echo "release_id=$(jq -r '.id' /tmp/release.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail closed and report every packaging blocker
        shell: bash
        run: |
          blockers=()
          if [[ "${{ needs.prerequisites.result }}" != "success" ]]; then blockers+=("metadata, release-notes, or same-SHA CI prerequisite failed"); fi
          if [[ "${{ needs.publish.result }}" != "success" ]]; then blockers+=("one or more platform package/signing/content checks failed"); fi

          if [[ "${{ needs.publish.result }}" == "success" ]]; then
            release=$(cat /tmp/release.json)
            if [[ "$release" == "null" ]]; then
              blockers+=("no release exists for v$VERSION yet — publish should have created one")
            else
              if [[ "$(jq -r '.draft' <<<"$release")" != "true" ]]; then blockers+=("the resolved release is not a draft (unexpected at this stage)"); fi
              if [[ "$(jq -r '.tag_name' <<<"$release")" != "v$VERSION" ]]; then blockers+=("the resolved release's tag_name does not match v$VERSION"); fi
              marker="<!-- fjord-candidate-sha: $GITHUB_SHA -->"
              if [[ "$(jq -r '.body // ""' <<<"$release")" != *"$marker"* ]]; then
                blockers+=("the resolved release does not carry the candidate marker for $GITHUB_SHA — it may belong to a different candidate")
              fi

              escaped_version="${VERSION//./\\.}"
              assets=$(jq -r '.assets[].name' <<<"$release")
              grep -Eq "Fjord.*${escaped_version}.*\.AppImage$" <<<"$assets" || blockers+=("Linux AppImage is missing")
              grep -Eq "Fjord.*${escaped_version}.*\.exe$" <<<"$assets" || blockers+=("Windows installer is missing")
              grep -Eq "Fjord.*${escaped_version}.*\.dmg$" <<<"$assets" || blockers+=("macOS package is missing")
              grep -Fxq 'latest.json' <<<"$assets" || blockers+=("updater manifest is missing")
              grep -Eq '\.sig$' <<<"$assets" || blockers+=("updater signatures are missing")

              # The asset-name greps above only prove *a* latest.json exists —
              # a matrix that finished with one platform still red can produce
              # a latest.json that simply omits that platform's entry, which
              # the above would miss entirely. Fetch and deep-verify it.
              manifest_url=$(jq -r '.assets[] | select(.name == "latest.json") | .browser_download_url' <<<"$release")
              if [[ -n "$manifest_url" ]]; then
                jq -r '[.assets[].name]' <<<"$release" > /tmp/asset-names.json
                if curl -fsSL "$manifest_url" -o /tmp/latest.json; then
                  if ! node scripts/verify-updater-manifest.mjs "$VERSION" "v$VERSION" /tmp/latest.json /tmp/asset-names.json; then
                    blockers+=("updater manifest (latest.json) is incomplete or inconsistent — see the step log above")
                  fi
                else
                  blockers+=("could not download latest.json to verify it")
                fi
              fi
            fi
          fi

          {
            echo "## Fjord v$VERSION packaging verification"
            if (( ${#blockers[@]} == 0 )); then
              echo "READY TO PUBLISH"
            else
              echo "BLOCKED"
              printf -- '- %s\n' "${blockers[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          (( ${#blockers[@]} == 0 ))

  # The only job allowed to make a release (and therefore the Tauri updater
  # endpoint, which only resolves published/non-prerelease releases) public.
  # Runs only on default success — i.e. every job above must have passed.
  # Publishes by the exact release ID `packaging-verification` resolved and
  # verified, not by re-resolving the tag here — re-resolving would reopen a
  # TOCTOU gap between "the release we just checked" and "the release we're
  # about to make public" (e.g. a concurrent manual edit, or in principle a
  # second matching release appearing between the two steps).
  publish-release:
    name: Publish the GitHub Release
    needs: [prerequisites, publish, packaging-verification]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish v${{ needs.prerequisites.outputs.version }} (release ${{ needs.packaging-verification.outputs.release_id }})
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.packaging-verification.outputs.release_id }}" \
            -f draft=false \
            -f prerelease=false
