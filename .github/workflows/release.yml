name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  TAURI_UPDATE_ENDPOINT: https://github.com/TheZan/Fjord/releases/latest/download/latest.json

jobs:
  prerequisites:
    name: v0.1 metadata and green CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify v0.1 release metadata
        run: |
          npm run test:release-gate
          node scripts/check-v0.1-release-gate.mjs
          npm run check:release-notes

      - name: Require successful CI for this commit
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              head_sha: context.sha,
              status: "completed",
              per_page: 20,
            });
            const successful = data.workflow_runs.find((run) => run.conclusion === "success");
            if (!successful) {
              core.setFailed(`No successful CI run exists for ${context.sha}.`);
              return;
            }
            await core.summary
              .addHeading("v0.1 CI prerequisite")
              .addLink(`CI run #${successful.run_number}`, successful.html_url)
              .write();

  publish:
    needs: prerequisites
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu --bundles appimage --features updater --config src-tauri/tauri.sidecar.conf.json"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --bundles nsis --features updater --config src-tauri/tauri.sidecar.conf.json"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles app,dmg --features updater --config src-tauri/tauri.sidecar.conf.json"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg --features updater --config src-tauri/tauri.sidecar.conf.json"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build askpass sidecar
        run: cargo build --release -p fjord-askpass --target ${{ matrix.target }}

      - name: Prepare askpass sidecar for Tauri
        env:
          FJORD_SIDECAR_TARGET: ${{ matrix.target }}
          FJORD_SIDECAR_PROFILE: release
        run: node scripts/prepare-askpass-sidecar.mjs

      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD secrets are required for signed Windows releases."
          }

          $certPath = Join-Path $env:RUNNER_TEMP "fjord-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare release Tauri config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: node scripts/prepare-tauri-release-config.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Fjord v__VERSION__ — Early Preview"
          releaseBody: "Early Preview candidate. Eligibility is reported by the v0.1 release gate job."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Verify Linux AppImage contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage=$(find target/${{ matrix.target }}/release/bundle/appimage -name 'Fjord*0.1.0*.AppImage' -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/fjord-askpass
          ! find squashfs-root -iname '*fixture*' -o -iname '*.env' | grep -q .

      - name: Verify macOS package contents
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name 'Fjord.app' -print -quit)
          dmg=$(find target/${{ matrix.target }}/release/bundle/dmg -name 'Fjord*0.1.0*.dmg' -print -quit)
          test -d "$app"
          test -n "$dmg"
          test -x "$app/Contents/MacOS/fjord-askpass"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "0.1.0"
          ! find "$app" -iname '*fixture*' -o -iname '*.env' | grep -q .

      - name: Verify Windows installer contents
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis" -Filter "Fjord*0.1.0*.exe" | Select-Object -First 1
          if (-not $installer) { throw "versioned Fjord NSIS installer was not produced" }
          $listing = 7z l $installer.FullName
          if ($LASTEXITCODE -ne 0) { $listing; throw "could not inspect NSIS installer" }
          if (-not ($listing | Select-String -SimpleMatch 'fjord-askpass.exe' -Quiet)) { throw "fjord-askpass.exe is missing" }
          if ($listing | Select-String -Pattern 'fixture|test-data|\.env' -Quiet) { throw "development-only content is present" }

  eligibility:
    name: v0.1 Early Preview eligibility
    if: ${{ always() }}
    needs: [prerequisites, publish]
    runs-on: ubuntu-latest
    environment: v0.1-release-gate
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      CLEAN_MACHINE_EVIDENCE: ${{ vars.V0_1_CLEAN_MACHINE_EVIDENCE }}
      FRESH_INSTALL_EVIDENCE: ${{ vars.V0_1_FRESH_INSTALL_EVIDENCE }}
    steps:
      - name: Fail closed and report every packaging blocker
        shell: bash
        run: |
          blockers=()
          if [[ "${{ needs.prerequisites.result }}" != "success" ]]; then blockers+=("metadata or same-SHA CI prerequisite failed"); fi
          if [[ "${{ needs.publish.result }}" != "success" ]]; then blockers+=("one or more platform package/signing/content checks failed"); fi
          if [[ -z "$CLEAN_MACHINE_EVIDENCE" ]]; then blockers+=("V0_1_CLEAN_MACHINE_EVIDENCE is not recorded"); fi
          if [[ -z "$FRESH_INSTALL_EVIDENCE" ]]; then blockers+=("V0_1_FRESH_INSTALL_EVIDENCE is not recorded"); fi

          if [[ "${{ needs.publish.result }}" == "success" ]]; then
            release=$(gh api "repos/${{ github.repository }}/releases/tags/v0.1.0")
            if [[ "$(jq -r .draft <<<"$release")" != "true" ]]; then blockers+=("release is not draft"); fi
            if [[ "$(jq -r .prerelease <<<"$release")" != "true" ]]; then blockers+=("release is not marked Early Preview/prerelease"); fi
            assets=$(jq -r '.assets[].name' <<<"$release")
            grep -Eq 'Fjord.*0\.1\.0.*\.AppImage$' <<<"$assets" || blockers+=("Linux AppImage is missing")
            grep -Eq 'Fjord.*0\.1\.0.*\.exe$' <<<"$assets" || blockers+=("Windows installer is missing")
            grep -Eq 'Fjord.*0\.1\.0.*\.dmg$' <<<"$assets" || blockers+=("macOS package is missing")
            grep -Fxq 'latest.json' <<<"$assets" || blockers+=("updater manifest is missing")
            grep -Eq '\.sig$' <<<"$assets" || blockers+=("updater signatures are missing")
          fi

          {
            echo "## Fjord v0.1.0 packaging gate"
            if (( ${#blockers[@]} == 0 )); then
              echo "ELIGIBLE FOR v0.1 EARLY PREVIEW REVIEW"
              echo "- Clean-machine evidence: $CLEAN_MACHINE_EVIDENCE"
              echo "- Fresh-install evidence: $FRESH_INSTALL_EVIDENCE"
            else
              echo "BLOCKED"
              printf -- '- %s\n' "${blockers[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          (( ${#blockers[@]} == 0 ))
