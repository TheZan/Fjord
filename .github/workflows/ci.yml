# CI on all three supported platforms (docs/tasks.md P0-09, SDD §5.4).
#
# Jobs:
#   - frontend: type-check + Vite build, vitest, and the i18n catalog drift
#     check (scripts/check-i18n.ts) — platform-independent, runs once.
#   - backend-lint: fmt and clippy (warnings are errors), once on Linux.
#   - backend-test: the full cargo test suite on Windows / macOS / Linux.
#   - askpass-sidecar-test: focused protocol/sidecar tests.
#   - bundle-smoke: unsigned bundles that must contain the askpass sidecar.

name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check-i18n

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux build needs the WebKitGTK stack.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  backend-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux build needs the WebKitGTK stack.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

  askpass-sidecar-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fjord-askpass

  bundle-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo build --release -p fjord-askpass --target ${{ matrix.target }}
      - name: Prepare target-specific sidecar
        env:
          FJORD_SIDECAR_TARGET: ${{ matrix.target }}
          FJORD_SIDECAR_PROFILE: release
        run: node scripts/prepare-askpass-sidecar.mjs
      - name: Build unsigned bundle
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config src-tauri/tauri.sidecar.conf.json

      - name: Verify Linux AppImage sidecar
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage=$(find target/${{ matrix.target }}/release/bundle/appimage -name '*.AppImage' -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/fjord-askpass

      - name: Verify macOS app sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sidecar=$(find target/${{ matrix.target }}/release/bundle/macos -path '*.app/Contents/MacOS/fjord-askpass' -print -quit)
          test -x "$sidecar"

      - name: Verify Windows installer sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $listing = 7z l $installer.FullName
          if ($LASTEXITCODE -ne 0) { $listing; throw "could not list the NSIS installer" }
          # `-notmatch` against an array filters it instead of returning a
          # boolean, so the old check threw on every run, sidecar or not.
          if (-not ($listing | Select-String -SimpleMatch 'fjord-askpass.exe' -Quiet)) {
            $listing
            throw "fjord-askpass.exe is missing from the installer"
          }
