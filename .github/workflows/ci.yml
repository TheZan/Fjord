# CI on all three supported platforms (docs/tasks.md P0-09, SDD §5.4).
#
# Jobs:
#   - frontend: type-check + Vite build, vitest, Playwright E2E, the i18n catalog drift check
#     (scripts/check-i18n.ts), the IPC contract drift check
#     (scripts/check-ipc-docs.ts), and release-script regressions
#     (release:verify, the release-script node:test suites, the Apple
#     signing decision lib, the updater-manifest completeness lib, the
#     draft-capable release-discovery lib/client, and a structural check
#     that release.yml's unsigned macOS step never references an Apple
#     signing secret — see docs/releasing.md and docs/release.md) —
#     platform-independent, runs once.
#   - backend-lint: fmt and clippy (warnings are errors), once on Linux.
#   - backend-test: the full cargo test suite on Windows / macOS / Linux.
#   - askpass-sidecar-test: focused protocol/sidecar tests.
#   - bundle-smoke: unsigned bundles that must contain the askpass sidecar.
#   - release-build-check: compiles `fjord` with the exact feature/profile
#     combination release.yml uses (`--release --features updater`), with no
#     bundling, signing secrets, or publishing — this is what would have
#     caught v0.1.0's release-only "cannot find serde_json in the crate
#     root" failure before it ever reached a tag push.

name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run check-i18n
      - run: npm run check-ipc-docs
      - run: npm run audit:public
      - run: npm run test:launch-gate
      - run: npm run release:verify
      - run: npm run test:release-verify
      - run: npm run test:release-prepare
      - run: npm run test:release-notes
      - run: npm run test:apple-signing
      - run: npm run test:updater-manifest
      - run: npm run test:release-workflow
      - run: npm run test:release-discovery

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux build needs the WebKitGTK stack.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  backend-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux build needs the WebKitGTK stack.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fresh-install lifecycle smoke
        run: cargo test -p fjord-app fresh_install_smoke_restores_each_repository_once_after_restart

      - name: Tests
        run: cargo test --workspace

  askpass-sidecar-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fjord-askpass

  # Reproduces the crate-graph/feature/profile combination release.yml's
  # `publish` job compiles (`cargo build --release ... --features updater`)
  # without needing the sidecar, bundler, or any signing secret — this is
  # a pure `cargo check`, not a bundle, and never touches the network beyond
  # crates.io/npm. It exists specifically to catch macro-hygiene/dependency
  # issues (like `tauri::generate_context!()` needing `serde_json` as a
  # direct dependency) that only surface under `--release --features
  # updater`, which no other CI job exercises together.
  release-build-check:
    name: Release-path build check (no publish, no signing secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux build needs the WebKitGTK stack.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check fjord with the release.yml feature/profile combination
        run: cargo check --release -p fjord --features updater

  bundle-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo build --release -p fjord-askpass --target ${{ matrix.target }}
      - name: Prepare target-specific sidecar
        env:
          FJORD_SIDECAR_TARGET: ${{ matrix.target }}
          FJORD_SIDECAR_PROFILE: release
        run: node scripts/prepare-askpass-sidecar.mjs
      - name: Build unsigned bundle
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config src-tauri/tauri.sidecar.conf.json

      - name: Verify Linux AppImage sidecar
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage=$(find target/${{ matrix.target }}/release/bundle/appimage -name '*.AppImage' -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/fjord-askpass

      - name: Verify macOS app sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sidecar=$(find target/${{ matrix.target }}/release/bundle/macos -path '*.app/Contents/MacOS/fjord-askpass' -print -quit)
          test -x "$sidecar"

      - name: Verify Windows installer sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $listing = 7z l $installer.FullName
          if ($LASTEXITCODE -ne 0) { $listing; throw "could not list the NSIS installer" }
          # `-notmatch` against an array filters it instead of returning a
          # boolean, so the old check threw on every run, sidecar or not.
          if (-not ($listing | Select-String -SimpleMatch 'fjord-askpass.exe' -Quiet)) {
            $listing
            throw "fjord-askpass.exe is missing from the installer"
          }
