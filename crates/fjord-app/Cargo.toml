[package]
name = "fjord-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
updater = []

[dependencies]
fjord-domain.workspace = true
fjord-ports.workspace = true
fjord-services.workspace = true
fjord-git.workspace = true
fjord-db.workspace = true
fjord-fs.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

tauri = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-updater = "2.10"

# Fixture repositories for the command-layer integration tests (P5-22). The
# adapters under test use these libraries too, but the fixtures are built
# independently of them so a broken adapter cannot fake a passing test.
[dev-dependencies]
tempfile = "3"
git2 = "0.21"
